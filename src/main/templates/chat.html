{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NL2SQL Portal - Truy vấn</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1>> SYS.NL2SQL_SESSION<span class="cursor">_</span></h1>

            <div class="header-actions">
                <div class="header-actions">
                    <span class="status-indicator">🟢 Đã kết nối DB</span>
                    <span class="separator">|</span>
                    <button class="user-profile" id="user-profile-btn" title="Nhấn để đăng xuất">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span id="current-username">{{userName}}</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="chat-area" id="chat-area">
            <div class="message bot">
                <div class="message-sender">BOT</div>
                <div class="message-bubble">
                    Xin chào. Hệ thống chuyển đổi ngôn ngữ tự nhiên sang SQL đã sẵn sàng. Vui lòng nhập yêu cầu truy vấn của bạn.
                </div>
            </div>
        </main>

        <footer class="input-area">
            <input type="text" id="query-input" class="query-input" placeholder="Ví dụ: Lấy danh sách nhân viên có lương lớn hơn 20 triệu..." autocomplete="off">

            <select id="schema-select" class="schema-select" title="Số lượng bảng cần lấy (topK)">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
            </select>

            <button id="send-btn" class="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </footer>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
