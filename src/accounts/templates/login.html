<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NL2SQL Portal - Đăng nhập</title>
    <style>
        /* Import font chữ hiện đại */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

        body {
            background-color: #0f172a; /* Màu nền tối (Slate 900) */
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: #1e293b; /* Màu form sáng hơn nền một chút (Slate 800) */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 380px;
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            color: #38bdf8; /* Màu xanh công nghệ (Sky 400) */
            font-family: 'JetBrains Mono', monospace; /* Font chữ kiểu code */
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #475569;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0284c7; /* Nút màu xanh đậm (Sky 600) */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            font-family: 'Inter', sans-serif;
        }

        .login-btn:hover {
            background: #0369a1; /* Xanh đậm hơn khi hover */
        }

        .login-btn:active {
            transform: translateY(1px); /* Hiệu ứng nhấn */
        }

        /* Biểu tượng con trỏ nhấp nháy tạo cảm giác terminal */
        .cursor {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <h1>> NL2SQL_SYS<span class="cursor">_</span></h1>
            <p>Truy xuất cơ sở dữ liệu nội bộ</p>
        </div>
        
        <form action="#" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Tài khoản</label>
                <input type="text" id="username" name="username" placeholder="Nhập tài khoản" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
            </div>
            
            <button type="submit" class="login-btn">Đăng nhập</button>
        </form>
    </div>

</body>
</html>
